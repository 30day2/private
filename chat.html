<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARx Ultimate P2P Chat</title>
<style>
:root{--bg:#fefefe;--text:#111;--accent:#1565c0;--msg-bg:#eee;--msg-you:#1565c0;}
[data-theme="dark"]{--bg:#121212;--text:#eee;--accent:#90caf9;--msg-bg:#1f1f1f;--msg-you:#90caf9;}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;}
header{padding:10px;background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:center;}
main{flex:1;display:flex;flex-direction:column;padding:10px;}
#login,#chat{margin:auto;width:95%;max-width:480px;text-align:center;}
input,button,select{padding:8px;margin:4px;border-radius:8px;border:1px solid rgba(0,0,0,0.2);font-size:16px;}
button{cursor:pointer;background:var(--accent);color:white;border:none;}
#messages{flex:1;overflow-y:auto;padding:10px;background:var(--msg-bg);border-radius:10px;margin:10px 0;}
.msg{padding:8px;margin:6px 0;border-radius:10px;max-width:80%;word-wrap:break-word;position:relative;}
.msg.you{background:var(--msg-you);color:#fff;margin-left:auto;}
.msg.them{background:rgba(0,0,0,0.2);margin-right:auto;}
.msg .status{font-size:10px;color:#888;position:absolute;bottom:2px;right:4px;}
#userList{font-size:12px;color:rgba(0,0,0,0.6);margin:4px 0;text-align:left;}
.row{display:flex;gap:6px;}
.row>input{flex:1;}
#emojiPicker{display:none;flex-wrap:wrap;max-height:120px;overflow-y:auto;border:1px solid #ccc;padding:4px;margin:4px;border-radius:6px;background:var(--msg-bg);}
#emojiPicker span{cursor:pointer;font-size:20px;margin:2px;}
</style>
</head>
<body data-theme="light">
<header>
  <div>🔐 JARx Ultimate Chat</div>
  <select id="themeSel"><option value="light">Light</option><option value="dark">Dark</option></select>
</header>
<main>
<div id="login">
  <input id="passcode" type="password" placeholder="Enter passcode">
  <input id="room" type="text" placeholder="Room name" value="main">
  <input id="nick" type="text" placeholder="Nickname" value="guest">
  <button onclick="joinChat()">Join Room</button>
  <p style="font-size:12px;opacity:0.7;">Access only with correct passcode</p>
</div>
<div id="chat" style="display:none;">
  <div id="userList">Peers: 0</div>
  <div id="messages"></div>
  <div class="row">
    <input id="msg" type="text" placeholder="Type message..." onkeydown="if(event.key==='Enter'){sendMessage();}">
    <button onclick="sendMessage()">Send</button>
    <button onclick="toggleEmoji()">😊</button>
  </div>
  <div id="emojiPicker"></div>
</div>
</main>

<script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
<script src="https://unpkg.com/signalhub@5.5.1/index.js"></script>
<script src="https://unpkg.com/webrtc-swarm@3.2.2/index.js"></script>

<script>
const ALLOWED_PASS="JARx_190_563208";
const hubs=["https://signalhub-jccqtwhdwc.now.sh","https://hub.vyzo.io","https://signalhub.perguth.de","https://signalhub-bt1.herokuapp.com"];
let key,hub,swarm,nick,roomName,userList={},messageStatus={};

document.getElementById("themeSel").onchange=e=>document.body.setAttribute("data-theme",e.target.value);

// --- crypto ---
async function getKey(pass){const enc=new TextEncoder();const h=await crypto.subtle.digest("SHA-256",enc.encode(pass));return crypto.subtle.importKey("raw",h,{name:"AES-GCM"},false,["encrypt","decrypt"]);}
async function encryptMessage(msg){const iv=crypto.getRandomValues(new Uint8Array(12));const data=new TextEncoder().encode(msg);const enc=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);return {iv:Array.from(iv),data:Array.from(new Uint8Array(enc))};}
async function decryptMessage(obj){try{const iv=new Uint8Array(obj.iv),data=new Uint8Array(obj.data);const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);return new TextDecoder().decode(dec);}catch{return null;}}

// --- UI ---
function showMessage(msg,isYou,id=null,status="Sent"){
  const div=document.createElement("div");
  div.className="msg "+(isYou?"you":"them");
  div.innerHTML=msg+"<div class='status' id='status_"+id+"'>"+status+"</div>";
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({behavior:"smooth"});
  if(isYou && id) messageStatus[id]=div.querySelector(".status");
  setTimeout(()=>div.remove(),3600*1000);
}
function updateUserList(){document.getElementById("userList").textContent="Peers: "+Object.keys(userList).length;}

// --- Emoji picker ---
const emojis=["😀","😂","😎","😍","🤔","👍","🙏","🎉","🔥","💯"];
const picker=document.getElementById("emojiPicker");
emojis.forEach(e=>{const sp=document.createElement("span");sp.textContent=e;sp.onclick=()=>{document.getElementById("msg").value+=e;};picker.appendChild(sp);});
function toggleEmoji(){picker.style.display=picker.style.display==="flex"?"none":"flex";}

// --- chat ---
async function joinChat(){
  const pass=document.getElementById("passcode").value.trim();
  if(pass!==ALLOWED_PASS){alert("Wrong passcode");return;}
  roomName=document.getElementById("room").value.trim()||"main";
  nick=document.getElementById("nick").value.trim()||"guest";
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="block";
  key=await getKey(pass);

  let connected=false;
  for(const url of hubs){
    try{hub=signalhub("jarx_"+roomName,[url]);connected=true;break;}catch(e){console.warn("Hub failed:",url,e);}
  }
  if(!connected){alert("Cannot connect to hubs");return;}
  swarm=webrtcSwarm(hub);

  swarm.on("connect",peer=>{
    const peerId=Math.random().toString(36).slice(2,8);
    userList[peerId]=peer;
    updateUserList();
    showMessage(`👤 ${peerId} joined`,false);

    peer.on("data",async d=>{
      const m=await decryptMessage(JSON.parse(d.toString()));
      if(m && m.text){
        showMessage(m.text,false,null);
        if(m.ackId && messageStatus[m.ackId]) messageStatus[m.ackId].textContent="Delivered";
      }
    });

    peer.on("close",()=>{delete userList[peerId];updateUserList();showMessage(`👋 ${peerId} left`,false);});
  });
}

// --- send ---
async function sendMessage(){
  const input=document.getElementById("msg");
  const msg=input.value.trim();
  if(!msg)return;
  const msgId=Math.random().toString(36).slice(2,10);
  showMessage(msg,true,msgId,"Sent");
  input.value="";
  const enc=await encryptMessage(JSON.stringify({text:msg,ackId:msgId}));
  const payload=JSON.stringify(enc);
  if(swarm && swarm.peers.size>0)swarm.peers.forEach(p=>p.send(payload));
}
</script>
</body>
</html>
