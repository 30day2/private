<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARx Secure Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Poppins,Arial,sans-serif;background:#0f0f0f;color:#eee;margin:0;display:flex;flex-direction:column;height:100vh;}
#login,#chat{margin:auto;text-align:center;width:90%;max-width:420px;}
input,button{padding:10px;border:none;border-radius:8px;margin:6px;font-size:16px;}
button{background:#007bff;color:white;cursor:pointer;}
button:hover{background:#0056b3;}
#messages{flex:1;overflow-y:auto;padding:10px;background:#1a1a1a;margin:10px 0;border-radius:10px;}
.msg{background:#333;padding:10px;border-radius:10px;margin:8px 0;word-wrap:break-word;max-width:80%;}
.you{background:#007bff;color:white;margin-left:auto;}
.them{background:#333;margin-right:auto;}
</style>
</head>
<body>
<div id="login">
  <h2>🔐 JARx Secure Chat</h2>
  <input id="passcode" type="password" placeholder="Enter passcode">
  <button onclick="joinChat()">Join</button>
  <p style="font-size:12px;opacity:0.7;">Only accessible with correct passcode</p>
</div>

<div id="chat" style="display:none;">
  <h3>Secure Room</h3>
  <div id="messages"></div>
  <input id="msg" type="text" placeholder="Type a message..." style="width:75%;">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
<script src="https://unpkg.com/signalhub@5.5.1/index.js"></script>
<script src="https://unpkg.com/webrtc-swarm@3.2.2/index.js"></script>

<script>
const ALLOWED_PASS = "JARx_190_563208";
let hub, swarm, key;

// ---- Encryption helpers ----
async function getKey(pass){
  const enc=new TextEncoder();
  const hash=await crypto.subtle.digest("SHA-256",enc.encode(pass));
  return crypto.subtle.importKey("raw",hash,{name:"AES-GCM"},false,["encrypt","decrypt"]);
}
async function encryptMessage(msg){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(msg);
  const enc=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);
  return {iv:Array.from(iv),data:Array.from(new Uint8Array(enc))};
}
async function decryptMessage(obj){
  try{
    const iv=new Uint8Array(obj.iv),data=new Uint8Array(obj.data);
    const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
    return new TextDecoder().decode(dec);
  }catch{return null;}
}

// ---- Join chat ----
async function joinChat(){
  const pass=document.getElementById("passcode").value.trim();
  if(pass!==ALLOWED_PASS){alert("Invalid passcode.");return;}
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="block";
  key=await getKey(pass);

  const hubs=[
    "https://signalhub-jccqtwhdwc.now.sh",
    "https://hub.vyzo.io",
    "https://signalhub.perguth.de",
    "https://signalhub-bt1.herokuapp.com"
  ];

  let connected=false;
  for(const url of hubs){
    try{
      console.log("Trying hub:",url);
      hub=signalhub("jarx_secure_room",[url]);
      await new Promise((resolve,reject)=>{
        const t=setTimeout(()=>reject("timeout"),3000);
        const s=hub.subscribe("ping");
        s.on("data",()=>{clearTimeout(t);resolve(true);});
        s.on("error",()=>{clearTimeout(t);reject("err");});
        hub.broadcast("ping",{ping:"hi"});
      });
      connected=true; break;
    }catch(e){console.warn("Hub failed:",url,e);}
  }
  if(!connected){alert("Could not connect to any SignalHub. Try again later.");return;}

  swarm=window.webrtcSwarm(hub);
  swarm.on("connect",peer=>{
    console.log("Connected to peer");
    peer.on("data",async data=>{
      const msg=await decryptMessage(JSON.parse(data.toString()));
      if(msg) showMessage(msg,false);
    });
  });
}

// ---- Send & display messages ----
async function sendMessage(){
  const input=document.getElementById("msg");
  const msg=input.value.trim();
  if(!msg)return;
  showMessage(msg,true);
  input.value="";
  const enc=await encryptMessage(msg);
  const payload=JSON.stringify(enc);
  if(swarm && swarm.peers.size>0){
    swarm.peers.forEach(p=>p.send(payload));
  }
}
function showMessage(msg,isYou){
  const div=document.createElement("div");
  div.className="msg "+(isYou?"you":"them");
  div.textContent=msg;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({behavior:"smooth"});
  setTimeout(()=>div.remove(),3600*1000); // delete after 1 hr
}
</script>
</body>
</html>
